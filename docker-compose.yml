services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phonics_adventure}
      POSTGRES_USER: ${POSTGRES_USER:-phonics_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password_before_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phonics_app} -d ${POSTGRES_DB:-phonics_adventure}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-phonics_app}:${POSTGRES_PASSWORD:-change_this_password_before_production}@db:5432/${POSTGRES_DB:-phonics_adventure}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
